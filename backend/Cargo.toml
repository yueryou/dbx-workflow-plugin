[package]
name = "dbx-plugin-dbx-workflow-plugin"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace]

[dependencies]
dbx-plugin-sdk = { version = "0.1.0", path = "C:/Program Files/nodejs/node_modules/@dbx-app/plugin-cli/sdk-root/plugins/sdk/rust/dbx-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4"] }
directories = "5"

# Keep plugin binaries close to the host app's size: default release settings
# leave ~20MB of symbols and unoptimized generic code in an OpenDAL-sized backend.
# panic stays "unwind" so the sidecar protocol can report panics as errors.
[profile.release]
strip = true
lto = true
codegen-units = 1
